version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: lr5_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: my_postgres_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ..
      dockerfile: LR5/Dockerfile
    container_name: lr5_app
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db/my_postgres_db
      DB_HOST: db
      DB_PORT: 5432
      HOST: 0.0.0.0
      PORT: 8000
    depends_on:
      - db
    ports:
      - "8000:8000"

volumes:
  postgres_data:
